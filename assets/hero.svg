<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="ShwePrompt — the AI prompt studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0918"/>
      <stop offset="0.55" stop-color="#171130"/>
      <stop offset="1" stop-color="#0c0918"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e08a"/>
      <stop offset="0.5" stop-color="#e0b34f"/>
      <stop offset="1" stop-color="#f9e08a"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b94a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8b94a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b2a8f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3b2a8f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="titleClip">
      <text x="120" y="205" font-size="118" font-weight="800"
            font-family="'Segoe UI',system-ui,-apple-system,sans-serif" letter-spacing="1">ShwePrompt</text>
    </clipPath>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1280" height="430" fill="url(#bg)"/>
  <rect width="1280" height="430" fill="url(#dots)"/>

  <!-- drifting aurora orbs -->
  <ellipse cx="200" cy="90" rx="300" ry="180" fill="url(#orbV)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 130 50; 0 0" dur="17s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1090" cy="330" rx="320" ry="190" fill="url(#orbG)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -150 -40; 0 0" dur="21s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="440" rx="380" ry="170" fill="url(#orbB)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 -30; 0 0" dur="19s" repeatCount="indefinite"/>
  </ellipse>

  <!-- eyebrow -->
  <text x="122" y="104" font-size="24" letter-spacing="8" fill="#e8b94a" opacity="0.95"
        font-family="'Segoe UI',system-ui,sans-serif" font-weight="600">AI PROMPT STUDIO
    <animate attributeName="opacity" values="0.95;0.55;0.95" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- title with shine sweep -->
  <g>
    <text x="120" y="205" font-size="118" font-weight="800" fill="url(#goldGrad)"
          font-family="'Segoe UI',system-ui,-apple-system,sans-serif" letter-spacing="1">ShwePrompt</text>
    <rect x="-260" y="70" width="180" height="160" fill="url(#shine)" clip-path="url(#titleClip)" opacity="0.8" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1500 0; 1500 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- subtitle -->
  <text x="122" y="258" font-size="29" fill="#d7d3ec" opacity="0.92"
        font-family="'Segoe UI',system-ui,sans-serif">Craft world-class prompts in seconds — the AI writes them for you.</text>

  <!-- cycling phrases -->
  <g font-size="24" font-family="'Segoe UI',system-ui,sans-serif" fill="#a89fd6">
    <text x="122" y="310" opacity="0">✨ Pick a mode → set options → AI assembles the perfect prompt
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.28;0.36" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="122" y="310" opacity="0">🔑 No key? Instant local assembly — add a relay key for AI power
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.36;0.44;0.64;0.72" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="122" y="310" opacity="0">🛡️ 100% private — your key lives in your browser only
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.72;0.80;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- right: golden core with rotating rings -->
  <g transform="translate(1122,158)">
    <circle r="112" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
    <circle r="88" fill="none" stroke="#e8b94a" stroke-width="2" opacity="0.65"/>
    <circle r="64" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.75"/>
    <g>
      <circle cx="0" cy="-88" r="7" fill="#e8b94a" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-64" r="5.5" fill="#c4b5fd" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5.5s" repeatCount="indefinite"/>
    </g>
    <circle r="112" fill="none" stroke="#e8b94a" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="112;124;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <!-- spark core: drawn 4-point star -->
    <g filter="url(#glow)">
      <path d="M0,-40 C3,-12 12,-3 40,0 C12,3 3,12 0,40 C-3,12 -12,3 -40,0 C-12,-3 -3,-12 0,-40 Z" fill="#f9e08a">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
  </g>

  <!-- rising sparkles -->
  <g fill="#f9e08a">
    <circle cx="700" cy="400" r="4"><animateTransform attributeName="transform" type="translate" values="0 0; 12 -90; 24 -170" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="410" r="3"><animateTransform attributeName="transform" type="translate" values="0 0; -14 -70; -26 -140" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="405" r="5"><animateTransform attributeName="transform" type="translate" values="0 0; 10 -110; 18 -200" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="410" r="3"><animateTransform attributeName="transform" type="translate" values="0 0; -10 -80; -18 -150" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="400" r="2.5"><animateTransform attributeName="transform" type="translate" values="0 0; 14 -70; 26 -130" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- bottom badge strip -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="21" font-weight="600">
    <rect x="122" y="352" width="150" height="40" rx="20" fill="#e8b94a" opacity="0.16"/>
    <text x="197" y="379" text-anchor="middle" fill="#e8b94a">13 modes</text>
    <rect x="284" y="352" width="190" height="40" rx="20" fill="#a78bfa" opacity="0.16"/>
    <text x="379" y="379" text-anchor="middle" fill="#c4b5fd">AI-first</text>
    <rect x="486" y="352" width="170" height="40" rx="20" fill="#67e8f9" opacity="0.14"/>
    <text x="571" y="379" text-anchor="middle" fill="#a5f3fc">BYO key</text>
  </g>
</svg>
